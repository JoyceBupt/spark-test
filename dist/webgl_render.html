<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL 3DGS 原生渲染器演示</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background-color: #000;
            color: #d4d4d4;
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .main-container {
            display: flex;
            height: 100vh;
            height: 100dvh;
        }

        .render-area {
            flex: 1;
            position: relative;
            background-color: #000;
            overflow: hidden;
        }

        .render-canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: manipulation;
        }

        /* 桌面端控制面板 */
        .control-panel-desktop {
            width: 350px;
            background-color: #2d2d30;
            border-left: 1px solid #464647;
            padding: 15px;
            overflow-y: auto;
            display: block;
        }

        /* 移动端控制面板 */
        .control-panel-mobile {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.8) 100%);
            padding: 15px;
            border-radius: 0;
            display: none;
        }

        /* 移动端主控制区域 - 始终可见 */
        .mobile-main-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.7) 100%);
            padding: 20px 15px 25px 15px;
            display: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .main-controls-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            justify-content: center;
        }

        .control-btn {
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            min-width: 50px;
            min-height: 50px;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .control-btn:hover {
            background-color: rgba(255, 255, 255, 0.25);
        }

        .control-btn:active {
            background-color: rgba(255, 255, 255, 0.35);
            transform: scale(0.95);
        }

        .control-btn:disabled {
            background-color: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed;
        }

        .control-btn.primary {
            background-color: #007acc;
            border-color: #007acc;
        }

        .control-btn.primary:hover {
            background-color: #005a9e;
        }

        .control-btn.primary:disabled {
            background-color: rgba(0, 122, 204, 0.3);
        }

        .control-btn.danger {
            background-color: #e74c3c;
            border-color: #e74c3c;
        }

        .control-btn.success {
            background-color: #27ae60;
            border-color: #27ae60;
        }

        /* 展开的控制面板按钮 */
        .expand-controls-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* 移动端检测 */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .control-panel-desktop {
                display: none;
            }

            .mobile-main-controls {
                display: block;
            }

            .expand-controls-btn {
                display: flex;
            }

            .render-area {
                height: 100vh;
                height: 100dvh;
            }
        }

        /* 桌面端样式 */
        .control-panel-desktop h2 {
            color: #4ec9b0;
            margin-top: 0;
            border-bottom: 1px solid #464647;
            padding-bottom: 10px;
            font-size: 16px;
        }

        .desktop-btn {
            background-color: #007acc;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px 0;
            width: 100%;
            font-family: inherit;
            font-size: 13px;
        }

        .desktop-btn:hover {
            background-color: #005a9e;
        }

        .desktop-btn:disabled {
            background-color: #464647;
            cursor: not-allowed;
        }

        .controls {
            margin: 15px 0;
        }

        .status {
            padding: 8px;
            border-radius: 4px;
            margin: 10px 0;
            font-weight: bold;
            font-size: 12px;
        }

        .status.loading {
            background-color: #1a365d;
            color: #90cdf4;
        }

        .status.success {
            background-color: #1a202c;
            color: #68d391;
        }

        .status.error {
            background-color: #2d1b1b;
            color: #f56565;
        }

        .status.warning {
            background-color: #2d2016;
            color: #f6e05e;
        }

        .slider-control {
            margin: 10px 0;
        }

        .slider-control label {
            display: block;
            color: #4ec9b0;
            margin-bottom: 5px;
            font-size: 12px;
        }

        .slider-control input[type="range"] {
            width: 100%;
            background-color: #2d2d30;
            height: 20px;
            -webkit-appearance: none;
            appearance: none;
            border-radius: 3px;
            outline: none;
        }

        .slider-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #007acc;
            cursor: pointer;
        }

        .slider-control .value {
            float: right;
            color: #569cd6;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 10px 0;
        }

        .stats-item {
            background-color: #1e1e1e;
            padding: 6px;
            border-radius: 4px;
            text-align: center;
        }

        .stats-item .value {
            font-size: 12px;
            font-weight: bold;
            color: #4ec9b0;
        }

        .stats-item .label {
            font-size: 9px;
            color: #969696;
        }

        /* 渲染信息覆盖 */
        .render-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 6px;
            color: #d4d4d4;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            z-index: 100;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .fps-counter {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 8px;
            border-radius: 6px;
            color: #4ec9b0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            font-weight: bold;
            z-index: 100;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 768px) {
            .render-overlay {
                top: 10px;
                left: 10px;
                padding: 6px;
                font-size: 10px;
            }

            .fps-counter {
                top: 10px;
                right: 70px;
                /* 为展开按钮留空间 */
                padding: 6px;
                font-size: 11px;
            }
        }

        /* 加载遮罩 */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #90cdf4;
            font-family: 'Courier New', monospace;
            z-index: 200;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2d2d30;
            border-top: 3px solid #4ec9b0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* 展开面板 */
        .expanded-panel {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 900;
            overflow-y: auto;
            padding: 60px 20px 20px 20px;
            display: none;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .close-panel-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .panel-section {
            margin-bottom: 25px;
            background-color: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .panel-section h3 {
            color: #4ec9b0;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 16px;
        }

        /* 响应式字体调整 */
        @media (max-width: 480px) {
            .main-controls-row {
                gap: 8px;
            }

            .control-btn {
                min-width: 45px;
                min-height: 45px;
                font-size: 16px;
            }
        }

        /* 兼容旧样式的类名映射 */
        .container {
            display: flex;
            height: 100vh;
        }

        #webgl-canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
            touch-action: manipulation;
        }

        #webgl-canvas:active {
            cursor: grabbing;
        }

        .control-panel {
            width: 350px;
            background-color: #2d2d30;
            border-left: 1px solid #464647;
            padding: 15px;
            overflow-y: auto;
        }

        .control-section {
            margin: 15px 0;
        }

        .control-section h3 {
            color: #4ec9b0;
            margin-top: 0;
            border-bottom: 1px solid #464647;
            padding-bottom: 10px;
            font-size: 14px;
        }

        .control-item {
            margin: 10px 0;
        }

        .control-item label {
            display: block;
            color: #4ec9b0;
            margin-bottom: 5px;
            font-size: 12px;
        }

        .control-item input, .control-item select, .control-item button {
            width: 100%;
            padding: 8px;
            border: 1px solid #555;
            background: #444;
            color: white;
            border-radius: 4px;
            font-family: inherit;
        }

        .control-item button {
            background-color: #007acc;
            cursor: pointer;
        }

        .control-item button:hover {
            background-color: #005a9e;
        }

        .control-item button:disabled {
            background-color: #464647;
            cursor: not-allowed;
        }

        .stats-display {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 4px;
        }

        .error-display {
            background-color: #2d1b1b;
            color: #f56565;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            display: none;
        }

        .loading-content {
            text-align: center;
            color: #90cdf4;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2d2d30;
            border-top: 3px solid #4ec9b0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        .range-input {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .range-input input[type="range"] {
            flex: 1;
        }

        .range-input span {
            font-size: 10px;
            min-width: 40px;
            color: #569cd6;
        }
    </style>
  <script type="module" crossorigin src="/assets/webgl-C8jGoG0d.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/babylonjs-BIcxYk3o.js">
  <link rel="modulepreload" crossorigin href="/assets/protobuf-B46OxRQv.js">
  <link rel="modulepreload" crossorigin href="/assets/binaryPlyLoader-XfY_fKVH.js">
</head>
<body>
    <div class="main-container">
        <!-- 渲染区域 -->
        <div class="render-area">
            <canvas id="webgl-canvas" class="render-canvas"></canvas>

            <!-- 加载遮罩 -->
            <div id="loading-overlay" class="loading-overlay" style="display: none;">
                <div class="loading-spinner"></div>
                <div id="loading-text">正在初始化WebGL 3DGS渲染器...</div>
                <div id="loading-progress" style="margin-top: 10px;">0%</div>
            </div>

            <!-- 渲染信息 -->
            <div class="render-overlay">
                <div id="render-info">等待初始化...</div>
                <div id="camera-info">相机: 等待中</div>
            </div>

            <!-- FPS计数器 -->
            <div class="fps-counter">
                <div id="fps-display">FPS: --</div>
                <div id="frame-count" style="font-size: 10px;">帧: 0</div>
            </div>

            <!-- 移动端展开控制按钮 -->
            <button class="expand-controls-btn" onclick="toggleExpandedPanel()">⚙</button>
        </div>

        <!-- 桌面端控制面板 -->
        <div class="control-panel-desktop">
            <h2>WebGL 3DGS 控制面板</h2>
            <div id="error-display" class="error-display"></div>

            <div class="controls">
                <button id="generate-data-btn" class="desktop-btn">开始动画</button>
                <button id="load-test-data-btn" class="desktop-btn">暂停动画</button>
                <button id="reset-camera-btn" class="desktop-btn">重置相机</button>
            </div>

            <div class="controls">
                <h3 style="color: #4ec9b0; font-size: 14px; margin-bottom: 10px;">动画控制</h3>
                <div class="slider-control">
                    <label>动画速度 <span class="value" id="animation-speed-value">1.0</span></label>
                    <input type="range" id="animation-speed" min="0.1" max="3.0" step="0.1" value="1.0">
                </div>
            </div>
            <div class="controls">
                <h3 style="color: #4ec9b0; font-size: 14px; margin-bottom: 10px;">性能统计</h3>
                <div class="stats-grid">
                    <div class="stats-item">
                        <div class="value" id="flame-to-mesh-time">-</div>
                        <div class="label">FLAME计算 (ms)</div>
                    </div>
                    <div class="stats-item">
                        <div class="value" id="mesh-binding-time">-</div>
                        <div class="label">面片几何 (ms)</div>
                    </div>
                    <div class="stats-item">
                        <div class="value" id="point-transform-time">-</div>
                        <div class="label">点变换 (ms)</div>
                    </div>
                    <div class="stats-item">
                        <div class="value" id="webgl-render-time">-</div>
                        <div class="label">WebGL渲染 (ms)</div>
                    </div>
                    <div class="stats-item">
                        <div class="value" id="real-frame-time">-</div>
                        <div class="label">帧时间 (ms)</div>
                    </div>
                    <div class="stats-item">
                        <div class="value" id="point-count">-</div>
                        <div class="label">点数量</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 移动端主控制区域 -->
    <div class="mobile-main-controls">

        <div class="main-controls-row">
            <button id="generate-data-btn-mobile" class="control-btn primary" title="开始动画">
                ▶
            </button>
            <button id="load-test-data-btn-mobile" class="control-btn warning" title="暂停动画">
                ⏸
            </button>
            <button id="reset-camera-btn-mobile" class="control-btn" title="重置相机">
                ↻
            </button>
        </div>

        <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px;">
            <span style="font-size: 12px; color: #ccc;">速度</span>
            <input type="range" id="animation-speed-mobile" min="0.1" max="3.0" step="0.1" value="1.0" style="flex: 1; max-width: 120px;">
            <span id="animation-speed-value-mobile" style="font-size: 12px; color: #4ec9b0; min-width: 25px;">1.0</span>
        </div>
    </div>

    <!-- 移动端展开面板 -->
    <div class="expanded-panel" id="expanded-panel">
        <button class="close-panel-btn" onclick="toggleExpandedPanel()">✕</button>

        <div class="panel-section">
            <h3 style="margin-bottom: 15px;">性能统计</h3>
            <div class="stats-grid">
                <div class="stats-item">
                    <div class="value" id="flame-to-mesh-time-mobile">-</div>
                    <div class="label">FLAME计算 (ms)</div>
                </div>
                <div class="stats-item">
                    <div class="value" id="mesh-binding-time-mobile">-</div>
                    <div class="label">面片几何 (ms)</div>
                </div>
                <div class="stats-item">
                    <div class="value" id="point-transform-time-mobile">-</div>
                    <div class="label">点变换 (ms)</div>
                </div>
                <div class="stats-item">
                    <div class="value" id="webgl-render-time-mobile">-</div>
                    <div class="label">WebGL渲染 (ms)</div>
                </div>
                <div class="stats-item">
                    <div class="value" id="real-frame-time-mobile">-</div>
                    <div class="label">帧时间 (ms)</div>
                </div>
                <div class="stats-item">
                    <div class="value" id="point-count-mobile">-</div>
                    <div class="label">点数量</div>
                </div>
            </div>
        </div>

        <div class="panel-section">
            <h3 style="margin-bottom: 10px;">说明</h3>
            <p style="font-size: 12px; color: #ccc; line-height: 1.4; margin: 0;">
                基于WebGL的3D高斯点云渲染系统，支持FLAME模型实时动画。
            </p>
        </div>
    </div>

</body>
</html>
