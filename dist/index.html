<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAME 3DGS 实时渲染系统</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 60px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 600px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.2em;
            margin-bottom: 40px;
            opacity: 0.9;
            line-height: 1.6;
        }

        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .btn {
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 15px;
            min-width: 200px;
            justify-content: center;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .btn.spark {
            background: linear-gradient(45deg, #ff6b6b, #ffa726);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        .btn.spark:hover {
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        .btn.babylon {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .btn.babylon:hover {
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }

        .icon {
            font-size: 24px;
        }

        .description {
            margin-top: 30px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .feature-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .feature {
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            text-align: left;
        }

        .feature-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .feature-desc {
            font-size: 0.9em;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 20px;
                margin: 20px;
            }
            
            .btn {
                min-width: 150px;
                padding: 15px 25px;
                font-size: 16px;
            }

            .feature-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>FLAME 3DGS 实时渲染</h1>
        <p class="subtitle">
            基于 FLAME 模型的 3D Gaussian Splatting 实时渲染系统<br>
            支持两种渲染引擎对比
        </p>

        <div class="button-group">
            <a href="spark_render.html" class="btn spark">
                <span class="icon">⚡</span>
                Spark 渲染器
            </a>
            <a href="babylon_render.html" class="btn babylon">
                <span class="icon">🌟</span>
                Babylon 渲染器
            </a>
        </div>

        <div class="description">
            <h3>功能特性</h3>
            <div class="feature-grid">
                <div class="feature">
                    <div class="feature-title">实时动画</div>
                    <div class="feature-desc">FLAME参数驱动的面部表情动画</div>
                </div>
                <div class="feature">
                    <div class="feature-title">双引擎支持</div>
                    <div class="feature-desc">Spark.js 和 Babylon.js 渲染对比</div>
                </div>
                <div class="feature">
                    <div class="feature-title">高性能计算</div>
                    <div class="feature-desc">WebAssembly 驱动的快速计算</div>
                </div>
                <div class="feature">
                    <div class="feature-title">交互控制</div>
                    <div class="feature-desc">相机控制和动画参数调节</div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
